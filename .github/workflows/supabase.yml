name: Supabase'e yükle
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  yukle:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PROJECT_REF: uleeogbmotjabbfcktcw
    steps:
      - uses: actions/checkout@v4
      - name: Anahtar kontrolü
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN tanımlı değil, yükleme atlandı."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.ok == 'true'
        with:
          version: latest
      - name: Gizli anahtarı Supabase'e kaydet
        if: steps.chk.outputs.ok == 'true' && env.VAPID_PRIVATE_KEY != ''
        run: supabase secrets set VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" --project-ref "$PROJECT_REF" --yes
      - name: Bildirim fonksiyonunu yükle
        if: steps.chk.outputs.ok == 'true'
        run: supabase functions deploy push --project-ref "$PROJECT_REF" --no-verify-jwt --yes
