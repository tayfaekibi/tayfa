name: Supabase'e yükle
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  yukle:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      PROJECT_REF: uleeogbmotjabbfcktcw
    steps:
      - uses: actions/checkout@v4
      - name: Anahtar kontrolü
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN tanımlı değil, yükleme atlandı."
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.ok == 'true'
        with:
          version: latest
      - name: Gizli anahtarı Supabase'e kaydet
        if: steps.chk.outputs.ok == 'true' && env.VAPID_PRIVATE_KEY != ''
        run: supabase secrets set VAPID_PRIVATE_KEY="$VAPID_PRIVATE_KEY" --project-ref "$PROJECT_REF" --yes
      - name: Veritabanı güncellemelerini uygula
        if: steps.chk.outputs.ok == 'true'
        run: |
          set -euo pipefail
          q() {  # $1: SQL dosyası → sonucu yazdırır, hata olursa durur
            jq -Rs '{query: .}' "$1" > /tmp/body.json
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data-binary @/tmp/body.json)
            if [ "$code" -ge 300 ]; then echo "Hata ($code):"; cat /tmp/out.json; exit 1; fi
          }
          printf '%s' "create table if not exists public.tayfa_migrations (name text primary key, applied_at timestamptz not null default now());
          alter table public.tayfa_migrations enable row level security;
          select coalesce(json_agg(name), '[]'::json) as names from public.tayfa_migrations;" > /tmp/init.sql
          q /tmp/init.sql
          applied=$(jq -c '.[0].names // []' /tmp/out.json)
          echo "Uygulanmış: $applied"
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            name=$(basename "$f")
            if echo "$applied" | jq -e --arg n "$name" 'index($n) != null' > /dev/null; then
              echo "Atlandı: $name"; continue
            fi
            echo "Uygulanıyor: $name"
            { cat "$f"; printf "\n;insert into public.tayfa_migrations (name) values ('%s') on conflict do nothing;\n" "$name"; } > /tmp/m.sql
            q /tmp/m.sql
            echo "Tamam: $name"
          done
      - name: Sunucu fonksiyonlarını yükle
        if: steps.chk.outputs.ok == 'true'
        run: supabase functions deploy push tavla king --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Fonksiyonu dene
        if: steps.chk.outputs.ok == 'true'
        run: |
          sleep 5
          curl -s -X POST "https://$PROJECT_REF.supabase.co/functions/v1/push" -H "Content-Type: application/json" -d '{}' | tee /tmp/sonuc.json
          echo
          grep -q '"gonderilen"' /tmp/sonuc.json
