name: Teşhis (salt okunur)
on:
  workflow_dispatch:
jobs:
  sorgu:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: uleeogbmotjabbfcktcw
    steps:
      - name: Sürpriz durumu
        run: |
          cat > /tmp/q.sql <<'SQL'
          select json_build_object(
            'boost', (select json_agg(json_build_object('used', b.used, 'game_id', b.game_id, 'created', b.created_at)) from public.tavla_boost b),
            'secrets', (select count(*) from public.tavla_secret),
            'games', (select json_agg(json_build_object('id', g.id, 'status', g.status, 'created', g.created_at, 'updated', g.updated_at,
                        'musa_created', g.created_by = b.user_id, 'musa_idx', array_position(g.players, b.user_id) - 1,
                        'turn_musa', g.turn = b.user_id, 'hand', g.state->>'hand', 'score', g.state->'score', 'dice', g.state->'dice',
                        'last', g.state->'last', 'winner_musa', g.winner = b.user_id) order by g.created_at)
                      from public.games g, public.tavla_boost b
                      where g.kind = 'tavla' and g.players @> array[b.user_id, b.opp_id] and g.created_at > now() - interval '4 days'),
            'push', (select json_agg(json_build_object('at', q.created_at, 'tag', q.tag)) from public.notify_queue q where q.tag like 'surpriz-%')
          ) as r;
          SQL
          jq -Rs '{query: .}' /tmp/q.sql > /tmp/body.json
          curl -sS -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data-binary @/tmp/body.json | jq .
